<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Agregar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/agregar.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-8">

    <div class="max-w-xl md:max-w-3xl mx-auto min-h-screen bg-white shadow-xl md:my-6 md:rounded-3xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-sky-600 to-blue-400 rounded-2xl flex items-center justify-center text-white shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-mountain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-blue-950 tracking-tight leading-none">HIELO MOSCÚ</h1>
                    <p class="text-xs font-semibold text-sky-600 mt-0.5">Agregar cliente</p>
                </div>
            </div>
            <span class="text-[9px] font-bold text-slate-400 text-right uppercase tracking-wider block">
                MÁS QUE HIELO,<br>CONFIANZA EN TU RUTA
            </span>
        </header>

        <!-- Formulario -->
        <main class="p-5 space-y-5 flex-1">
            <form id="formAgregar" class="space-y-4">
                
                <!-- 1. Datos del Cliente -->
                <div class="space-y-3">
                    <h2 class="text-xs font-bold text-blue-950 flex items-center">
                        <i class="fa-solid fa-user text-sky-500 mr-2"></i> Datos del cliente
                    </h2>
                    
                    <div class="space-y-2">
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2">
                            <i class="fa-solid fa-store text-slate-400 text-xs mr-3"></i>
                            <span class="text-[11px] font-bold text-blue-950 w-32 shrink-0">Nombre del negocio</span>
                            <input type="text" id="nombre" required placeholder="Ej. Abarrotes La Esperanza" class="w-full bg-transparent text-xs font-medium text-slate-800 focus:outline-none">
                        </div>

                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2">
                            <i class="fa-solid fa-location-dot text-slate-400 text-xs mr-3"></i>
                            <span class="text-[11px] font-bold text-blue-950 w-32 shrink-0">Ubicación / Dirección</span>
                            <input type="text" id="ubicacionTexto" required placeholder="Ej. Av. Bordo de Xochiaca" class="w-full bg-transparent text-xs font-medium text-slate-800 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- 2. Ubicación GPS / Mapa -->
                <div class="space-y-3">
                    <h2 class="text-xs font-bold text-blue-950 flex items-center">
                        <i class="fa-solid fa-map-pin text-sky-500 mr-2"></i> Coordenadas GPS en Mapa
                    </h2>

                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-bold text-blue-950">Toca el mapa para fijar el pin exacto</span>
                            <button type="button" onclick="centrarGpsActual()" class="text-sky-600 font-bold hover:underline">
                                <i class="fa-solid fa-crosshairs mr-1"></i> Mi GPS
                            </button>
                        </div>
                        <div id="mapaPreview" class="w-full h-48 rounded-xl border border-slate-200 overflow-hidden z-10"></div>
                    </div>
                </div>

                <!-- 3. Asignación Logística (Ruta y Día) -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-blue-950 mb-1">Ruta Asignada</label>
                        <select id="ruta" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-xs font-bold text-blue-950 focus:outline-none focus:border-sky-500">
                            <option value="Ruta 1">Ruta 1 (Neza)</option>
                            <option value="Ruta 2">Ruta 2 (Chimalhuacán)</option>
                            <option value="Ruta 3">Ruta 3 (Ecatepec)</option>
                            <option value="Ruta 4">Ruta 4 (CDMX Oriente)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-blue-950 mb-1">Día de Entrega</label>
                        <select id="dia" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-xs font-bold text-blue-950 focus:outline-none focus:border-sky-500">
                            <option value="Lunes">Lunes</option>
                            <option value="Martes">Martes</option>
                            <option value="Miercoles">Miércoles</option>
                            <option value="Jueves">Jueves</option>
                            <option value="Viernes">Viernes</option>
                            <option value="Sabado">Sábado</option>
                        </select>
                    </div>
                </div>

                <!-- 4. Enfriador -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xs font-bold text-blue-950 flex items-center">
                            <i class="fa-solid fa-snowflake text-sky-500 mr-2"></i> Enfriador
                        </h2>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                            <span class="block text-[10px] font-bold text-slate-400">No. Serie</span>
                            <input type="text" id="serie" placeholder="Ej. SN-4587" class="w-full bg-transparent text-xs font-bold text-blue-950 focus:outline-none mt-0.5">
                        </div>
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                            <span class="block text-[10px] font-bold text-slate-400">Capacidad</span>
                            <input type="text" id="capacidad" placeholder="Ej. 5,000 L" class="w-full bg-transparent text-xs font-bold text-blue-950 focus:outline-none mt-0.5">
                        </div>
                    </div>
                </div>

                <!-- 5. Notas -->
                <div class="space-y-2">
                    <h2 class="text-xs font-bold text-blue-950 flex items-center">
                        <i class="fa-solid fa-note-sticky text-sky-500 mr-2"></i> Notas
                    </h2>
                    <div class="relative bg-slate-50 border border-slate-200 rounded-2xl p-3">
                        <textarea id="notas" rows="2" maxlength="250" placeholder="Instrucciones de entrega..." class="w-full bg-transparent text-xs font-medium text-slate-800 focus:outline-none resize-none"></textarea>
                    </div>
                </div>

                <!-- Campos Ocultos de Coordenadas -->
                <input type="hidden" id="latitud" value="19.412530">
                <input type="hidden" id="longitud" value="-99.018240">

                <!-- Botones de Acción -->
                <div class="flex space-x-3 pt-2">
                    <a href="clientes.html" class="w-1/3 py-3 text-center bg-slate-100 text-sky-600 font-bold rounded-2xl text-xs hover:bg-slate-200 transition-colors">
                        Cancelar
                    </a>
                    <button type="submit" class="w-2/3 py-3 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-2xl text-xs transition-colors shadow-lg shadow-sky-500/30 flex items-center justify-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Guardar cliente</span>
                    </button>
                </div>

            </form>
        </main>

        <!-- Navegación -->
        <nav class="sticky md:relative bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-3 px-6 mt-auto">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-map text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Mapa</span>
                </a>
                <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Clientes</span>
                </a>
                <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Rutas</span>
                </a>
                <a href="agregar.html" class="flex flex-col items-center text-sky-600 font-bold">
                    <div class="w-8 h-8 bg-sky-500 text-white rounded-full flex items-center justify-center shadow-md shadow-sky-500/30">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                    <span class="text-[10px] mt-1">Agregar</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Leaflet JS y Lógica de Alta -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let latSel = 19.412530, lngSel = -99.018240;

        const previewMap = L.map('mapaPreview').setView([latSel, lngSel], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(previewMap);

        let marker = L.marker([latSel, lngSel], { draggable: true }).addTo(previewMap);

        function actualizarCoordenadas(lat, lng) {
            latSel = lat;
            lngSel = lng;
            document.getElementById('latitud').value = lat;
            document.getElementById('longitud').value = lng;
        }

        marker.on('dragend', function(e) {
            const pos = e.target.getLatLng();
            actualizarCoordenadas(pos.lat, pos.lng);
        });

        previewMap.on('click', function(e) {
            marker.setLatLng(e.latlng);
            actualizarCoordenadas(e.latlng.lat, e.latlng.lng);
        });

        function centrarGpsActual() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    previewMap.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    actualizarCoordenadas(lat, lng);
                });
            } else {
                alert('Geolocalización no disponible.');
            }
        }

        // Manejar el guardado limpio en localStorage
        document.getElementById('formAgregar').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoCliente = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value.trim(),
                direccion: document.getElementById('ubicacionTexto').value.trim(),
                ruta: document.getElementById('ruta').value,
                dia: document.getElementById('dia').value,
                serie: document.getElementById('serie').value.trim(),
                capacidad: document.getElementById('capacidad').value.trim(),
                notas: document.getElementById('notas').value.trim(),
                lat: parseFloat(document.getElementById('latitud').value),
                lng: parseFloat(document.getElementById('longitud').value)
            };

            const clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            clientes.push(nuevoCliente);
            localStorage.setItem('hielo_moscu_clientes', JSON.stringify(clientes));

            alert('✅ ¡Cliente registrado con éxito!');
            window.location.href = 'clientes.html';
        });
    </script>
</body>
</html>
