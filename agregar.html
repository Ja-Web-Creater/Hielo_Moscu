<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Programar Entrega</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-truck-fast text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">Programar Entrega</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Logística Estilo Amazon</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Formulario Principal -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <form id="clienteForm" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3.5">
            
            <!-- Nombre del Cliente -->
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-store text-sky-500 mr-1"></i> Nombre del Negocio / Cliente *</label>
                <input type="text" id="nombre" required placeholder="Ej. Tiendas 3B Cuauhtémoc" class="input-field">
            </div>

            <!-- Teléfono -->
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-phone text-sky-500 mr-1"></i> Teléfono de Contacto</label>
                <input type="tel" id="telefono" placeholder="Ej. 5512345678" class="input-field">
            </div>

            <!-- 1. UBICACIÓN DE SALIDA (ORIGEN) -->
            <div class="p-3 bg-sky-50/50 rounded-xl border border-sky-100 space-y-2">
                <label class="block text-[11px] font-bold text-sky-900"><i class="fa-solid fa-warehouse text-sky-600 mr-1"></i> 1. Ubicación de Salida (Base / Origen)</label>
                <input type="text" id="origen" required value="Balvino Dávalos 78, México 1ra Secc, 57620 Cdad. Nezahualcóyotl, Méx." class="input-field bg-white text-xs">
            </div>

            <!-- 2. UBICACIÓN DE DESTINO (ENTREGA) -->
            <div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-100 space-y-2">
                <div class="flex items-center justify-between">
                    <label class="block text-[11px] font-bold text-emerald-900"><i class="fa-solid fa-location-dot text-emerald-600 mr-1"></i> 2. Ubicación de Destino (Cliente)</label>
                    <button type="button" onclick="usarGpsActual()" class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-lg hover:bg-emerald-200">
                        <i class="fa-solid fa-crosshairs mr-1"></i> Mi GPS
                    </button>
                </div>
                <input type="text" id="destino" required placeholder="Ej. Av Cuauhtémoc 70, Pavon, Nezahualcóyotl" class="input-field bg-white text-xs">
                <button type="button" onclick="buscarYTrazarRuta()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs transition-colors shadow-sm">
                    <i class="fa-solid fa-route mr-1"></i> Calcular y Visualizar Ruta
                </button>
            </div>

            <!-- Asignación de Ruta y Día -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-truck-ramp-box text-sky-500 mr-1"></i> Asignar Ruta *</label>
                    <select id="ruta" required class="input-field">
                        <option value="Ruta 1">Ruta 1 (Neza Centro)</option>
                        <option value="Ruta 2">Ruta 2 (Neza Norte)</option>
                        <option value="Ruta 3">Ruta 3 (Neza Oriente)</option>
                        <option value="Ruta 4">Ruta 4 (Neza Poniente)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-calendar-day text-sky-500 mr-1"></i> Día de Entrega *</label>
                    <select id="dia" required class="input-field">
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miercoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sabado">Sábado</option>
                    </select>
                </div>
            </div>

            <!-- Mapa Interactivo de Previsualización estilo Amazon -->
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-map text-sky-500 mr-1"></i> Previsualización de Trazo de Ruta</label>
                <div id="previewMap" class="w-full h-56 rounded-xl border border-slate-200"></div>
            </div>

            <!-- Campos ocultos para la BD/LocalStorage sin incomodar al usuario -->
            <input type="hidden" id="originLat" value="19.407812">
            <input type="hidden" id="originLng" value="-99.027541">
            <input type="hidden" id="destLat" value="19.412530">
            <input type="hidden" id="destLng" value="-99.018240">

            <!-- Botón de Guardado -->
            <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-sky-600/20 active:scale-[0.98]">
                <i class="fa-solid fa-circle-check mr-1.5"></i> Confirmar y Guardar Entrega
            </button>
        </form>
    </main>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-medium mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-medium mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-medium mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-bold mt-1">Agregar</span>
            </a>
        </div>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // Coordenadas Base por defecto (Balvino Dávalos 78, Neza)
        let origLat = 19.407812, origLng = -99.027541;
        let destLat = 19.412530, destLng = -99.018240;

        const previewMap = L.map('previewMap').setView([origLat, origLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(previewMap);

        let markerOrigen = L.marker([origLat, origLng], { title: 'Origen' }).addTo(previewMap).bindPopup('🏢 Salida (Base)');
        let markerDestino = L.marker([destLat, destLng], { title: 'Destino', draggable: true }).addTo(previewMap).bindPopup('🏪 Entrega (Cliente)');
        let routeLine = L.polyline([[origLat, origLng], [destLat, destLng]], { color: '#0284c7', weight: 4, dashArray: '6, 6' }).addTo(previewMap);

        // Permitir arrastrar el pin de destino libremente en Neza
        markerDestino.on('dragend', function(e) {
            const pos = e.target.getLatLng();
            destLat = pos.lat;
            destLng = pos.lng;
            document.getElementById('destLat').value = destLat;
            document.getElementById('destLng').value = destLng;
            actualizarLineaRuta();
        });

        function actualizarLineaRuta() {
            routeLine.setLatLngs([[origLat, origLng], [destLat, destLng]]);
            const bounds = L.latLngBounds([[origLat, origLng], [destLat, destLng]]);
            previewMap.fitBounds(bounds.pad(0.3));
        }

        // Buscar dirección de destino mediante Geocodificación inteligente
        async function buscarYTrazarRuta() {
            const direccionTexto = document.getElementById('destino').value;
            if (!direccionTexto) return alert('Escribe la dirección de destino.');

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccionTexto + ', Nezahualcóyotl, México')}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    destLat = parseFloat(data[0].lat);
                    destLng = parseFloat(data[0].lon);

                    document.getElementById('destLat').value = destLat;
                    document.getElementById('destLng').value = destLng;

                    markerDestino.setLatLng([destLat, destLng]);
                    actualizarLineaRuta();
                } else {
                    // Fallback directo si no se encuentra texto exacto: ubicar en Av Cuauhtémoc
                    destLat = 19.412530;
                    destLng = -99.018240;
                    markerDestino.setLatLng([destLat, destLng]);
                    actualizarLineaRuta();
                }
            } catch (error) {
                actualizarLineaRuta();
            }
        }

        function usarGpsActual() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    destLat = position.coords.latitude;
                    destLng = position.coords.longitude;
                    document.getElementById('destLat').value = destLat;
                    document.getElementById('destLng').value = destLng;
                    markerDestino.setLatLng([destLat, destLng]);
                    actualizarLineaRuta();
                });
            }
        }

        // Guardar entrega estilo Amazon
        document.getElementById('clienteForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevaEntrega = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                origen: document.getElementById('origen').value,
                direccion: document.getElementById('destino').value,
                ruta: document.getElementById('ruta').value,
                dia: document.getElementById('dia').value,
                lat: parseFloat(document.getElementById('destLat').value),
                lng: parseFloat(document.getElementById('destLng').value),
                origLat: parseFloat(document.getElementById('originLat').value),
                origLng: parseFloat(document.getElementById('originLng').value)
            };

            const clientesExistentes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            clientesExistentes.push(nuevaEntrega);
            localStorage.setItem('hielo_moscu_clientes', JSON.stringify(clientesExistentes));

            alert('✅ ¡Ruta de entrega estilo Amazon programada con éxito!');
            window.location.href = 'index.html';
        });

        actualizarLineaRuta();
    </script>
</body>
</html>
