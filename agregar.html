<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - GPS Nacional y Rutas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-location-crosshairs text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">GPS Hielo Moscú</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Localización Nacional México</p>
                </div>
            </div>
            <span class="text-[10px] font-bold bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full border border-emerald-100">
                <i class="fa-solid fa-signal mr-1 animate-pulse"></i> GPS Activo
            </span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <form id="clienteForm" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3.5">
            
            <!-- Datos del Cliente -->
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-store text-sky-500 mr-1"></i> Nombre del Negocio / Cliente *</label>
                <input type="text" id="nombre" required placeholder="Ej. Abarrotes La Guadalupana" class="input-field">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-phone text-sky-500 mr-1"></i> Teléfono</label>
                    <input type="tel" id="telefono" placeholder="Ej. 5512345678" class="input-field">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-map-location-dot text-sky-500 mr-1"></i> Estado / Ciudad *</label>
                    <input type="text" id="estado" required value="Estado de México" placeholder="Ej. CDMX, Jalisco..." class="input-field">
                </div>
            </div>

            <!-- Módulo de Dirección y Buscador Nacional -->
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-location-dot text-sky-500 mr-1"></i> Dirección Exacta de Entrega *</label>
                <div class="flex space-x-2">
                    <input type="text" id="direccion" required placeholder="Calle, Número, Colonia o Municipio" class="input-field">
                    <button type="button" onclick="buscarDireccionNacional()" class="px-3 bg-sky-600 text-white rounded-xl text-xs font-bold hover:bg-sky-700 transition-colors shrink-0">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <!-- Sensor GPS Satelital y Controles -->
            <div class="p-3 bg-sky-50/60 rounded-xl border border-sky-100 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold text-sky-900"><i class="fa-solid fa-satellite-dish text-sky-600 mr-1"></i> Ubicación GPS Satelital</span>
                    <button type="button" onclick="obtenerGpsNativo()" class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-lg hover:bg-emerald-200 transition-colors">
                        <i class="fa-solid fa-crosshairs mr-1"></i> Usar mi GPS Actual
                    </button>
                </div>
                
                <!-- Mapa Universal con Pin Arrastrable -->
                <div id="previewMap" class="w-full h-60 rounded-xl border border-slate-200"></div>
                <p class="text-[10px] text-slate-500 text-center font-medium">
                    <i class="fa-solid fa-hand-pointer text-sky-500 mr-1"></i> Arrastra el marcador o toca el mapa para fijar la entrada exacta.
                </p>
            </div>

            <!-- Asignación Logística -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-truck-ramp-box text-sky-500 mr-1"></i> Ruta Asignada *</label>
                    <select id="ruta" required class="input-field">
                        <option value="Ruta 1">Ruta 1</option>
                        <option value="Ruta 2">Ruta 2</option>
                        <option value="Ruta 3">Ruta 3</option>
                        <option value="Ruta 4">Ruta 4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1"><i class="fa-solid fa-calendar-day text-sky-500 mr-1"></i> Día de Entrega *</label>
                    <select id="dia" required class="input-field">
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miercoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sabado">Sábado</option>
                    </select>
                </div>
            </div>

            <!-- Campos Internos de Registro GPS -->
            <input type="hidden" id="latitud" value="19.412530">
            <input type="hidden" id="longitud" value="-99.018240">

            <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-sky-600/20 active:scale-[0.98]">
                <i class="fa-solid fa-floppy-disk mr-1.5"></i> Guardar Cliente y Generar GPS
            </button>
        </form>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-medium mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-medium mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-medium mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-bold mt-1">Agregar</span>
            </a>
        </div>
    </nav>

    <!-- Leaflet JS Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let latSel = 19.412530, lngSel = -99.018240;

        // Inicialización del Mapa con tiles universales de alta velocidad
        const previewMap = L.map('previewMap').setView([latSel, lngSel], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(previewMap);

        let marker = L.marker([latSel, lngSel], { draggable: true }).addTo(previewMap);

        function guardarCoordenadas(lat, lng) {
            latSel = lat;
            lngSel = lng;
            document.getElementById('latitud').value = lat;
            document.getElementById('longitud').value = lng;
        }

        // Mover pin al arrastrar o tocar el mapa
        marker.on('dragend', function(e) {
            const pos = e.target.getLatLng();
            guardarCoordenadas(pos.lat, pos.lng);
        });

        previewMap.on('click', function(e) {
            marker.setLatLng(e.latlng);
            guardarCoordenadas(e.latlng.lat, e.latlng.lng);
        });

        // 1. GPS Satelital Nativo (Sensado de alta precisión en todo México)
        function obtenerGpsNativo() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        previewMap.setView([lat, lng], 17);
                        marker.setLatLng([lat, lng]);
                        guardarCoordenadas(lat, lng);
                        alert('📍 GPS detectado con éxito en tu posición actual.');
                    },
                    function(error) {
                        alert('No se pudo acceder al GPS satelital. Asegúrate de otorgar permisos de ubicación en tu navegador.');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        // 2. Buscador de Direcciones para todo México
        async function buscarDireccionNacional() {
            const dir = document.getElementById('direccion').value;
            const edo = document.getElementById('estado').value;

            if (!dir) return alert('Escribe la dirección a buscar.');

            const query = `${dir}, ${edo}, México`;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    previewMap.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    guardarCoordenadas(lat, lng);
                } else {
                    alert('Dirección aproximada. Puedes ajustar la ubicación exacta tocando el mapa.');
                }
            } catch (err) {
                alert('Búsqueda completada. Toca el mapa para afinar la entrada del local.');
            }
        }

        // Guardar cliente con datos de GPS registrados
        document.getElementById('clienteForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoCliente = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                estado: document.getElementById('estado').value,
                direccion: document.getElementById('direccion').value,
                ruta: document.getElementById('ruta').value,
                dia: document.getElementById('dia').value,
                lat: parseFloat(document.getElementById('latitud').value),
                lng: parseFloat(document.getElementById('longitud').value)
            };

            const clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            clientes.push(nuevoCliente);
            localStorage.setItem('hielo_moscu_clientes', JSON.stringify(clientes));

            alert('✅ ¡Ubicación GPS guardada con éxito en el sistema!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
