<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Agregar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-circle-plus text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">Nuevo Registro</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Alta de Cliente y Ubicación</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <form class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3" onsubmit="event.preventDefault(); alert('Cliente registrado con éxito');">
            
            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Nombre del Negocio / Cliente</label>
                <input type="text" required placeholder="Ej. Tienda Don Pepe" class="input-field">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Teléfono de Contacto</label>
                <input type="tel" placeholder="Ej. 5512345678" class="input-field">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Día de Visita / Reparto</label>
                <select class="input-field">
                    <option value="">Selecciona un día</option>
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miercoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Sabado">Sábado</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Selecciona Ubicación en el Mapa</label>
                <div id="previewMap" class="w-full h-52 rounded-xl border border-slate-100 mb-2"></div>
                <p class="text-[10px] text-slate-400 text-center">Toca el mapa para fijar las coordenadas GPS del cliente.</p>
            </div>

            <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs transition-colors shadow-md shadow-sky-600/20 mt-2">
                Guardar Cliente
            </button>
        </form>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-medium mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-medium mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-medium mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-bold mt-1">Agregar</span>
            </a>
        </div>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const previewMap = L.map('previewMap').setView([19.4326, -99.1332], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(previewMap);

        let marker;
        previewMap.on('click', function(e) {
            const { lat, lng } = e.latlng;
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(previewMap);
            }
        });
    </script>
</body>
</html>
