<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Rutas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rutas.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-8">

    <div class="max-w-xl md:max-w-4xl mx-auto min-h-screen bg-white shadow-xl md:my-6 md:rounded-3xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-sky-600 to-blue-400 rounded-2xl flex items-center justify-center text-white shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-mountain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-blue-950 tracking-tight leading-none">HIELO MOSCÚ</h1>
                    <p class="text-xs font-semibold text-sky-600 mt-0.5">Rutas</p>
                </div>
            </div>
        </header>

        <!-- Contenido -->
        <main class="p-5 space-y-4 flex-1">
            
            <!-- Buscador -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-sky-500">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="buscador-rutas" onkeyup="filtrarRutas()" placeholder="Buscar ruta, Zona o día" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium text-slate-700 focus:outline-none focus:border-sky-500 transition-all">
            </div>

            <!-- Contadores Rápidos -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center space-x-3">
                    <div class="w-10 h-10 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center text-lg">
                        <i class="fa-solid fa-route"></i>
                    </div>
                    <div>
                        <span id="total-rutas" class="block text-lg font-black text-blue-950 leading-none">0</span>
                        <span class="text-[11px] font-medium text-slate-400">rutas</span>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center space-x-3">
                    <div class="w-10 h-10 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center text-lg">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div>
                        <span id="total-zonas" class="block text-lg font-black text-blue-950 leading-none">0</span>
                        <span class="text-[11px] font-medium text-slate-400">zonas</span>
                    </div>
                </div>
            </div>

            <!-- Título y Ordenador -->
            <div class="flex items-center justify-between pt-1">
                <h2 class="text-sm font-bold text-blue-950">Lista de rutas</h2>
                <div class="flex items-center space-x-1 text-xs text-slate-500">
                    <span>Ordenar por</span>
                    <select class="font-bold text-blue-950 bg-transparent focus:outline-none cursor-pointer">
                        <option>Día</option>
                        <option>Zona</option>
                    </select>
                </div>
            </div>

            <!-- Lista Dinámica de Tarjetas de Rutas -->
            <div id="lista-rutas" class="space-y-3">
                <!-- Se renderiza desde JavaScript con datos de localStorage -->
            </div>

        </main>

        <!-- Navegación -->
        <nav class="sticky md:relative bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-3 px-6 mt-auto">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-map text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Mapa</span>
                </a>
                <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Clientes</span>
                </a>
                <a href="rutas.html" class="flex flex-col items-center text-sky-600 font-bold">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span class="text-[10px] mt-1">Rutas</span>
                </a>
                <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <div class="w-8 h-8 bg-sky-500 text-white rounded-full flex items-center justify-center shadow-md shadow-sky-500/30">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                    <span class="text-[10px] font-medium mt-1">Agregar</span>
                </a>
                <a href="#" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Buscar</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Script de Lógica y Optimización -->
    <script>
        function cargarRutas() {
            const clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            
            const rutasMap = {};
            const zonasSet = new Set();

            clientes.forEach(cliente => {
                const rutaNombre = cliente.ruta || 'Ruta 1';
                const zona = cliente.direccion || cliente.estado || 'Nezahualcóyotl';
                zonasSet.add(zona);

                if (!rutasMap[rutaNombre]) {
                    rutasMap[rutaNombre] = {
                        nombre: rutaNombre,
                        clientesCount: 0,
                        dia: cliente.dia || 'Lunes',
                        zona: zona,
                        color: obtenerColorRuta(rutaNombre)
                    };
                }
                rutasMap[rutaNombre].clientesCount++;
            });

            const rutasArray = Object.values(rutasMap);

            document.getElementById('total-rutas').innerText = rutasArray.length;
            document.getElementById('total-zonas').innerText = zonasSet.size;

            const contenedor = document.getElementById('lista-rutas');
            contenedor.innerHTML = '';

            if (rutasArray.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-slate-50 p-10 rounded-2xl border border-slate-100 text-center space-y-2">
                        <i class="fa-solid fa-route text-3xl text-slate-300"></i>
                        <h3 class="text-xs font-bold text-blue-950">No hay rutas activas</h3>
                        <p class="text-[11px] text-slate-400">Las rutas se generan automáticamente al registrar clientes.</p>
                    </div>`;
                return;
            }

            rutasArray.forEach(ruta => {
                contenedor.innerHTML += `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3 ruta-card">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-4 h-4 rounded-full ${ruta.color}"></div>
                                <h3 class="text-sm font-bold text-blue-950">${ruta.nombre}</h3>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                        </div>

                        <div class="flex items-center space-x-4 text-xs font-medium text-slate-500">
                            <span><i class="fa-regular fa-calendar text-sky-600 mr-1"></i> ${ruta.dia}</span>
                            <span><i class="fa-solid fa-users text-sky-600 mr-1"></i> ${ruta.clientesCount} clientes</span>
                            <span><i class="fa-solid fa-location-dot text-sky-600 mr-1"></i> Zona: ${ruta.zona}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="verMapaRuta('${ruta.nombre}')" class="py-2 bg-sky-50 text-sky-700 font-bold rounded-xl text-xs flex items-center justify-center space-x-1.5 hover:bg-sky-100 cursor-pointer transition-colors">
                                <i class="fa-solid fa-map"></i>
                                <span>Ver mapa</span>
                            </button>
                            <button onclick="editarRuta('${ruta.nombre}')" class="py-2 bg-sky-50 text-sky-700 font-bold rounded-xl text-xs flex items-center justify-center space-x-1.5 hover:bg-sky-100 cursor-pointer transition-colors">
                                <i class="fa-solid fa-pen"></i>
                                <span>Editar</span>
                            </button>
                        </div>
                    </div>`;
            });
        }

        function obtenerColorRuta(nombreRuta) {
            if (nombreRuta.includes('1')) return 'bg-orange-500';
            if (nombreRuta.includes('2')) return 'bg-purple-600';
            if (nombreRuta.includes('3')) return 'bg-blue-600';
            if (nombreRuta.includes('4')) return 'bg-emerald-600';
            return 'bg-sky-500';
        }

        function verMapaRuta(nombreRuta) {
            window.location.href = `index.html?ruta=${encodeURIComponent(nombreRuta)}`;
        }

        function editarRuta(nombreRuta) {
            alert(`Gestionando configuración para: ${nombreRuta}`);
        }

        function filtrarRutas() {
            const text = document.getElementById('buscador-rutas').value.toLowerCase().trim();
            document.querySelectorAll('.ruta-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(text) ? 'block' : 'none';
            });
        }

        cargarRutas();
    </script>
</body>
</html>
