<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Rutas Programadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-route text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">Programación de Rutas</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Asignaciones por Unidad</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Contenedor dinámico de rutas -->
        <div id="contenedor-rutas" class="space-y-4">
            <!-- Se poblará vía JavaScript -->
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-medium mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-medium mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-bold mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-medium mt-1">Agregar</span>
            </a>
        </div>
    </nav>

    <script>
        function renderizarRutas() {
            const clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            const contenedor = document.getElementById('contenedor-rutas');

            if (clientes.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center">
                        <i class="fa-solid fa-truck-ramps-hole text-3xl text-slate-300 mb-2"></i>
                        <h3 class="text-xs font-bold text-slate-800">No hay rutas generadas</h3>
                        <p class="text-[11px] text-slate-500 mt-1">Agrega nuevos clientes y asígnales una ruta (Ruta 1, Ruta 2, etc.).</p>
                    </div>`;
                return;
            }

            // Agrupar clientes por ruta
            const rutasNombres = ['Ruta 1', 'Ruta 2', 'Ruta 3', 'Ruta 4'];
            contenedor.innerHTML = '';

            rutasNombres.forEach(nombreRuta => {
                const clientesRuta = clientes.filter(c => c.ruta === nombreRuta);
                if (clientesRuta.length > 0) {
                    let htmlRuta = `
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                                <span class="text-xs font-bold text-sky-600"><i class="fa-solid fa-truck-fast mr-1"></i> ${nombreRuta}</span>
                                <span class="text-[10px] font-bold bg-sky-50 text-sky-700 px-2 py-0.5 rounded-full">${clientesRuta.length} Clientes</span>
                            </div>
                            <div class="space-y-2">`;

                    clientesRuta.forEach(c => {
                        htmlRuta += `
                            <div class="p-2.5 bg-slate-50 rounded-xl flex items-center justify-between">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-800">${c.nombre}</h4>
                                    <p class="text-[10px] text-slate-500">${c.direccion}</p>
                                    <span class="text-[9px] font-semibold text-sky-600"><i class="fa-solid fa-calendar mr-1"></i>Día: ${c.dia}</span>
                                </div>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank" class="text-xs text-sky-600 font-bold hover:underline">
                                    <i class="fa-solid fa-location-arrow"></i> GPS
                                </a>
                            </div>`;
                    });

                    htmlRuta += `</div></div>`;
                    contenedor.innerHTML += htmlRuta;
                }
            });
        }

        renderizarRutas();
    </script>
</body>
</html>
