<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Mapa y Rutas Internas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-snowflake text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">Hielo Moscú</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Sistema GPS Interno</p>
                </div>
            </div>
            <span id="badge-total" class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-sky-50 text-sky-600 border border-sky-100">
                0 Entregas
            </span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Filtro por Días -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
            <p class="text-[11px] font-bold text-slate-700 mb-2 px-1"><i class="fa-solid fa-filter text-sky-500 mr-1"></i> Filtrar Entregas por Día</p>
            <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filtrarDia('todos')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-sky-600 text-white transition-all shrink-0">Todos</button>
                <button onclick="filtrarDia('Lunes')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Lunes</button>
                <button onclick="filtrarDia('Martes')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Martes</button>
                <button onclick="filtrarDia('Miercoles')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Miércoles</button>
                <button onclick="filtrarDia('Jueves')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Jueves</button>
                <button onclick="filtrarDia('Viernes')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Viernes</button>
                <button onclick="filtrarDia('Sabado')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Sábado</button>
            </div>
        </div>

        <!-- Mapa Interno de la App -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-xs font-bold text-slate-700"><i class="fa-solid fa-map-location-dot text-sky-500 mr-1"></i> Mapa de Operación Interno</h2>
                <span id="info-ruta" class="text-[10px] font-semibold text-slate-400">Vista general</span>
            </div>
            <div id="map" class="w-full h-80 rounded-xl overflow-hidden border border-slate-100 z-10"></div>
        </div>

        <!-- Lista de Paradas Interactiva Interna -->
        <div id="lista-paradas" class="space-y-2">
            <!-- Se genera dinámicamente -->
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-bold mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-medium mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-medium mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-medium mt-1">Agregar</span>
            </a>
        </div>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const map = L.map('map').setView([19.412530, -99.018240], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);
        let routePolyline = null;
        let marcadoresArray = [];

        function cargarMapa(diaFiltro = 'todos') {
            markersGroup.clearLayers();
            if (routePolyline) map.removeLayer(routePolyline);
            marcadoresArray = [];

            const clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            
            const filtrados = diaFiltro === 'todos' 
                ? clientes 
                : clientes.filter(c => c.dia.toLowerCase() === diaFiltro.toLowerCase());

            document.getElementById('badge-total').innerText = filtrados.length + ' Entregas';
            document.getElementById('info-ruta').innerText = diaFiltro === 'todos' ? 'Todas las entregas' : 'Entregas del ' + diaFiltro;

            const listaContenedor = document.getElementById('lista-paradas');
            listaContenedor.innerHTML = '';

            if (filtrados.length === 0) {
                listaContenedor.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
                        <i class="fa-solid fa-location-dot text-2xl text-slate-300 mb-2"></i>
                        <h3 class="text-xs font-bold text-slate-700">No hay entregas para mostrar</h3>
                        <p class="text-[10px] text-slate-400 mt-0.5">Registra clientes en la pestaña "Agregar".</p>
                    </div>`;
                return;
            }

            const coordsLinea = [];

            filtrados.forEach((cliente, index) => {
                const punto = [cliente.lat, cliente.lng];
                coordsLinea.push(punto);

                // Crear Marcador Interno en el Mapa
                const marker = L.marker(punto).addTo(markersGroup);
                marker.bindPopup(`
                    <div class="text-xs space-y-1">
                        <strong class="text-sky-700 text-sm">${index + 1}. ${cliente.nombre}</strong><br>
                        <span class="text-slate-600"><i class="fa-solid fa-location-dot text-sky-500"></i> ${cliente.direccion}</span><br>
                        <span class="font-bold text-slate-800"><i class="fa-solid fa-truck text-sky-500"></i> ${cliente.ruta} (${cliente.dia})</span><br>
                        <span class="text-slate-500 block"><i class="fa-solid fa-phone text-sky-500"></i> ${cliente.telefono || 'Sin teléfono'}</span>
                    </div>
                `);

                marcadoresArray.push(marker);

                // Tarjeta de parada: Al hacer clic, CENTRA EL MAPA INTERNO (Sin abrir Google Maps)
                listaContenedor.innerHTML += `
                    <div onclick="enfocarCliente(${index})" class="bg-white p-3 rounded-xl border border-slate-100 flex items-center justify-between shadow-sm cursor-pointer hover:border-sky-300 transition-all">
                        <div class="flex items-center space-x-3">
                            <div class="w-7 h-7 bg-sky-100 text-sky-700 rounded-full font-bold text-xs flex items-center justify-center shrink-0">
                                ${index + 1}
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-800">${cliente.nombre}</h4>
                                <p class="text-[10px] text-slate-500">${cliente.direccion}</p>
                                <span class="inline-block px-2 py-0.5 text-[9px] font-bold rounded bg-sky-50 text-sky-600 mt-1">${cliente.ruta} • ${cliente.dia}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-sky-600 bg-sky-50 px-2 py-1 rounded-lg">
                                <i class="fa-solid fa-crosshairs mr-1"></i> Ver en Mapa
                            </span>
                        </div>
                    </div>`;
            });

            // Trazar línea de ruta interna
            if (coordsLinea.length > 1) {
                routePolyline = L.polyline(coordsLinea, {
                    color: '#0284c7',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '8, 8'
                }).addTo(map);
            }

            if (filtrados.length > 0) {
                const group = new L.featureGroup(markersGroup.getLayers());
                map.fitBounds(group.getBounds().pad(0.3));
            }
        }

        // Función para enfocar el mapa interno en una parada específica al tocarla
        function enfocarCliente(index) {
            const marker = marcadoresArray[index];
            if (marker) {
                const latLng = marker.getLatLng();
                map.setView(latLng, 17, { animate: true });
                marker.openPopup();
            }
        }

        function filtrarDia(dia) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-sky-600', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.currentTarget.classList.remove('bg-slate-100', 'text-slate-600');
            event.currentTarget.classList.add('bg-sky-600', 'text-white');

            cargarMapa(dia);
        }

        cargarMapa('todos');
    </script>
</body>
</html>
