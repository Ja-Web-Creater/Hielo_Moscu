<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Mapa y Rutas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header Principal -->
    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-snowflake text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">Hielo Moscú</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Logística y Rutas</p>
                </div>
            </div>
            <div class="flex items-center space-x-1">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-600 border border-emerald-100">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span> Sistema en Línea
                </span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Filtros por Días -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
            <p class="text-xs font-bold text-slate-700 mb-2 px-1"><i class="fa-solid fa-calendar-days text-sky-500 mr-1"></i> Filtrar Rutas por Día</p>
            <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filtrarPorDia('todos')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-sky-600 text-white transition-all shadow-sm shrink-0">Todos</button>
                <button onclick="filtrarPorDia('lunes')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Lunes</button>
                <button onclick="filtrarPorDia('martes')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Martes</button>
                <button onclick="filtrarPorDia('miercoles')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Miércoles</button>
                <button onclick="filtrarPorDia('jueves')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Jueves</button>
                <button onclick="filtrarPorDia('viernes')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Viernes</button>
                <button onclick="filtrarPorDia('sabado')" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 transition-all shrink-0">Sábado</button>
            </div>
        </div>

        <!-- Contenedor del Mapa -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-xs font-bold text-slate-700"><i class="fa-solid fa-map-location-dot text-sky-500 mr-1"></i> Mapa de Operación</h2>
                <span id="contador-puntos" class="text-[11px] font-semibold text-slate-400">0 puntos en ruta</span>
            </div>
            <div id="map" class="w-full h-80 rounded-xl overflow-hidden border border-slate-100"></div>
        </div>

        <!-- Estado Vacío Informativo -->
        <div id="estado-vacio" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
            <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-map text-xl"></i>
            </div>
            <h3 class="text-xs font-bold text-slate-800">No hay ubicaciones cargadas</h3>
            <p class="text-[11px] text-slate-500 mt-1">Registra nuevos clientes para visualizarlos en el mapa y en las rutas del día.</p>
        </div>

    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-bold mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-medium mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-medium mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-medium mt-1">Agregar</span>
            </a>
        </div>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const map = L.map('map').setView([19.4326, -99.1332], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function filtrarPorDia(dia) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-sky-600', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.currentTarget.classList.remove('bg-slate-100', 'text-slate-600');
            event.currentTarget.classList.add('bg-sky-600', 'text-white');
        }
    </script>
</body>
</html>
