<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/clientes.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-8">

    <div class="max-w-xl md:max-w-4xl mx-auto min-h-screen bg-white shadow-xl md:my-6 md:rounded-3xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-sky-600 to-blue-400 rounded-2xl flex items-center justify-center text-white shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-mountain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-blue-950 tracking-tight leading-none">HIELO MOSCÚ</h1>
                    <p class="text-xs font-semibold text-sky-600 mt-0.5">Directorio de clientes</p>
                </div>
            </div>
            <span id="contador-clientes" class="text-xs font-bold bg-sky-50 text-sky-600 px-3 py-1.5 rounded-xl border border-sky-100">
                0 clientes
            </span>
        </header>

        <!-- Contenido -->
        <main class="p-5 space-y-4 flex-1">
            
            <!-- Buscador -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-sky-500">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="buscador" onkeyup="filtrarClientes()" placeholder="Buscar por nombre, dirección o ruta" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium text-slate-700 focus:outline-none focus:border-sky-500 transition-all">
            </div>

            <!-- Lista de Clientes (Cargada desde MySQL vía PHP) -->
            <div id="lista-clientes" class="space-y-3">
                <div class="text-center py-10 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-2 text-sky-500"></i>
                    <p>Cargando clientes desde la base de datos...</p>
                </div>
            </div>

        </main>

        <!-- Navegación -->
        <nav class="sticky md:relative bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-3 px-6 mt-auto">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-map text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Mapa</span>
                </a>
                <a href="clientes.html" class="flex flex-col items-center text-sky-600 font-bold">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] mt-1">Clientes</span>
                </a>
                <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Rutas</span>
                </a>
                <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
                    <div class="w-8 h-8 bg-sky-500 text-white rounded-full flex items-center justify-center shadow-md shadow-sky-500/30">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                    <span class="text-[10px] font-medium mt-1">Agregar</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Lógica de Conexión con MySQL -->
    <script>
        let clientesGlobal = [];

        function cargarClientes() {
            fetch('obtener_clientes.php')
                .then(response => response.json())
                .then(clientes => {
                    clientesGlobal = clientes;
                    renderizarClientes(clientes);
                })
                .catch(error => {
                    console.error('Error al obtener clientes:', error);
                    document.getElementById('lista-clientes').innerHTML = `
                        <div class="bg-rose-50 p-6 rounded-2xl border border-rose-100 text-center text-rose-600 text-xs">
                            <i class="fa-solid fa-triangle-exclamation text-lg mb-1"></i>
                            <p>No se pudo conectar con la base de datos MySQL.</p>
                        </div>`;
                });
        }

        function renderizarClientes(clientes) {
            const contenedor = document.getElementById('lista-clientes');
            const contador = document.getElementById('contador-clientes');
            
            if (contador) contador.innerText = clientes.length + ' clientes';
            contenedor.innerHTML = '';

            if (clientes.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-slate-50 p-10 rounded-2xl border border-slate-100 text-center space-y-2">
                        <i class="fa-solid fa-users-slash text-3xl text-slate-300"></i>
                        <h3 class="text-xs font-bold text-blue-950">No hay clientes registrados en MySQL</h3>
                        <p class="text-[11px] text-slate-400">Comienza a agregar clientes desde el botón inferior (+).</p>
                    </div>`;
                return;
            }

            clientes.forEach(cliente => {
                contenedor.innerHTML += `
                    <div class="cliente-card bg-slate-50 hover:bg-white p-3.5 rounded-2xl border border-slate-100 hover:border-sky-200 hover:shadow-md transition-all flex items-center justify-between">
                        <div class="space-y-1">
                            <h3 class="text-xs font-bold text-blue-950">${cliente.name}</h3>
                            <p class="text-[11px] font-medium text-slate-400 flex items-center">
                                <i class="fa-solid fa-location-dot text-sky-500 mr-1"></i> ${cliente.address || 'Ubicación guardada'}
                            </p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="text-center px-2.5 py-1 rounded-xl bg-sky-100 text-sky-700">
                                <span class="block text-[10px] font-bold leading-tight">${cliente.route || 'Ruta 1'}</span>
                                <span class="block text-[9px] font-medium opacity-80">${cliente.delivery_day || 'Lunes'}</span>
                            </div>
                            <button onclick="eliminarCliente(${cliente.id})" class="w-8 h-8 rounded-full bg-white border border-slate-200 text-rose-500 flex items-center justify-center hover:bg-rose-50 transition-colors cursor-pointer">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>`;
            });
        }

        function eliminarCliente(id) {
            if (confirm('¿Deseas eliminar este cliente de la base de datos MySQL?')) {
                const formData = new FormData();
                formData.append('id', id);

                fetch('eliminar_cliente.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        cargarClientes();
                    } else {
                        alert('❌ Error al eliminar: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al conectar con el servidor.');
                });
            }
        }

        function filtrarClientes() {
            const text = document.getElementById('buscador').value.toLowerCase().trim();
            const filtrados = clientesGlobal.filter(c => 
                (c.name && c.name.toLowerCase().includes(text)) ||
                (c.address && c.address.toLowerCase().includes(text)) ||
                (c.route && c.route.toLowerCase().includes(text))
            );
            renderizarClientes(filtrados);
        }

        // Cargar al iniciar
        cargarClientes();
    </script>
</body>
</html>
