<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-users text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold leading-tight text-slate-900">Directorio</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Gestión de Clientes</p>
                </div>
            </div>
            <a href="agregar.html" class="w-8 h-8 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center font-bold text-sm hover:bg-sky-100 transition-colors">
                <i class="fa-solid fa-plus"></i>
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Buscador -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" placeholder="Buscar cliente por nombre o zona..." class="input-field pl-9 text-xs">
        </div>

        <!-- Estado Vacío -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center">
            <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-users-slash text-xl"></i>
            </div>
            <h3 class="text-xs font-bold text-slate-800">No hay clientes registrados</h3>
            <p class="text-[11px] text-slate-500 mt-1">Usa el botón superior derecho (+) para agregar tu primer cliente al sistema.</p>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 py-2 px-4 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-map text-base"></i>
                <span class="text-[10px] font-medium mt-1">Mapa</span>
            </a>
            <a href="clientes.html" class="flex flex-col items-center text-sky-600">
                <i class="fa-solid fa-users text-base"></i>
                <span class="text-[10px] font-bold mt-1">Clientes</span>
            </a>
            <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-route text-base"></i>
                <span class="text-[10px] font-medium mt-1">Rutas</span>
            </a>
            <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span class="text-[10px] font-medium mt-1">Agregar</span>
            </a>
        </div>
    </nav>

</body>
</html>
