<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-8">

    <div class="max-w-xl md:max-w-4xl mx-auto min-h-screen bg-white shadow-xl md:my-6 md:rounded-3xl overflow-hidden flex flex-col">
        
        <!-- Header con Branding -->
        <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-sky-600 to-blue-400 rounded-2xl flex items-center justify-center text-white shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-mountain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-blue-950 tracking-tight leading-none">HIELO MOSCÚ</h1>
                    <p class="text-xs font-semibold text-sky-600 mt-0.5">Clientes</p>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="p-5 space-y-4 flex-1">
            
            <!-- Campo de Búsqueda -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-sky-500">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="buscador" onkeyup="filtrarClientes()" placeholder="Buscar cliente, negocio o zona" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium text-slate-700 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all">
            </div>

            <!-- Encabezado de Lista y Ordenamiento -->
            <div class="flex items-center justify-between pt-1">
                <h2 class="text-sm font-bold text-blue-950">Lista de clientes</h2>
                <div class="flex items-center space-x-1 text-xs text-slate-500">
                    <span>Ordenar por</span>
                    <select class="font-bold text-blue-950 bg-transparent focus:outline-none cursor-pointer">
                        <option>Nombre</option>
                        <option>Ruta</option>
                        <option>Zona</option>
                    </select>
                </div>
            </div>

            <!-- Contenedor Dinámico de Tarjetas -->
            <div id="lista-clientes" class="space-y-3">
                <!-- Se llena mediante JavaScript -->
            </div>

        </main>

        <!-- Navegación Adaptativa -->
        <nav class="sticky md:relative bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-3 px-6 mt-auto">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <i class="fa-solid fa-map text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Mapa</span>
                </a>
                <a href="clientes.html" class="flex flex-col items-center text-sky-600 font-bold">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] mt-1">Clientes</span>
                </a>
                <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Rutas</span>
                </a>
                <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <div class="w-8 h-8 bg-sky-500 text-white rounded-full flex items-center justify-center shadow-md shadow-sky-500/30">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                    <span class="text-[10px] font-medium mt-1">Agregar</span>
                </a>
                <a href="#" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Buscar</span>
                </a>
            </div>
        </nav>
    </div>

    <script>
        const clientesEjemplo = [
            { id: 1, nombre: "Abarrotes Lupita", zona: "Nezahualcóyotl", ruta1: "Ruta 1", dia1: "Lunes", ruta2: "Ruta 2", dia2: "Lunes", bg1: "bg-sky-100 text-sky-700", bg2: "bg-emerald-100 text-emerald-700" },
            { id: 2, nombre: "Cremería San Juan", zona: "Chimalhuacán", ruta1: "Ruta 3", dia1: "Martes", ruta2: "Ruta 4", dia2: "Martes", bg1: "bg-rose-100 text-rose-700", bg2: "bg-purple-100 text-purple-700" },
            { id: 3, nombre: "Miscelánea El Sol", zona: "Ecatepec", ruta1: "Ruta 5", dia1: "Miércoles", ruta2: "Ruta 6", dia2: "Miércoles", bg1: "bg-amber-100 text-amber-700", bg2: "bg-cyan-100 text-cyan-700" },
            { id: 4, nombre: "Abarrotes Del Centro", zona: "CDMX Oriente", ruta1: "Ruta 7", dia1: "Jueves", ruta2: "Ruta 8", dia2: "Jueves", bg1: "bg-sky-100 text-sky-700", bg2: "bg-purple-100 text-purple-700" },
            { id: 5, nombre: "CARNESY FEST", zona: "Ixtapaluca", ruta1: "Ruta 9", dia1: "Jueves", ruta2: "Ruta 10", dia2: "Jueves", bg1: "bg-emerald-100 text-emerald-700", bg2: "bg-amber-100 text-amber-700" },
            { id: 6, nombre: "Frutas y Verduras La Paz", zona: "Nezahualcóyotl", ruta1: "Ruta 11", dia1: "Viernes", ruta2: "Ruta 12", dia2: "Viernes", bg1: "bg-rose-100 text-rose-700", bg2: "bg-sky-100 text-sky-700" },
            { id: 7, nombre: "Tortillería La Esperanza", zona: "Chimalhuacán", ruta1: "Ruta 13", dia1: "Sábado", ruta2: "Ruta 14", dia2: "Sábado", bg1: "bg-purple-100 text-purple-700", bg2: "bg-cyan-100 text-cyan-700" },
            { id: 8, nombre: "Farmacia Bienestar", zona: "Ecatepec", ruta1: "Ruta 15", dia1: "Sábado", ruta2: "Ruta Ixtapaluca", dia2: "Viernes", bg1: "bg-rose-100 text-rose-700", bg2: "bg-sky-100 text-sky-700" }
        ];

        function cargarClientes() {
            const guardados = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            const lista = guardados.length > 0 ? guardados : clientesEjemplo;
            const contenedor = document.getElementById('lista-clientes');
            contenedor.innerHTML = '';

            lista.forEach(cliente => {
                contenedor.innerHTML += `
                    <div class="cliente-card bg-slate-50 hover:bg-white p-3.5 rounded-2xl border border-slate-100 hover:border-sky-200 hover:shadow-md transition-all flex items-center justify-between">
                        <div class="space-y-1">
                            <h3 class="text-xs font-bold text-blue-950">${cliente.nombre}</h3>
                            <p class="text-[11px] font-medium text-slate-400 flex items-center">
                                <i class="fa-solid fa-location-dot text-sky-500 mr-1"></i> ${cliente.zona || cliente.direccion || 'Nezahualcóyotl'}
                            </p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="text-center px-2.5 py-1 rounded-xl ${cliente.bg1 || 'bg-sky-100 text-sky-700'}">
                                <span class="block text-[10px] font-bold leading-tight">${cliente.ruta1 || cliente.ruta || 'Ruta 1'}</span>
                                <span class="block text-[9px] font-medium opacity-80">${cliente.dia1 || cliente.dia || 'Lunes'}</span>
                            </div>
                            <div class="text-center px-2.5 py-1 rounded-xl ${cliente.bg2 || 'bg-emerald-100 text-emerald-700'}">
                                <span class="block text-[10px] font-bold leading-tight">${cliente.ruta2 || 'Ruta 2'}</span>
                                <span class="block text-[9px] font-medium opacity-80">${cliente.dia2 || 'Lunes'}</span>
                            </div>
                            <button onclick="verCliente(${cliente.id})" class="w-8 h-8 rounded-full bg-white border border-slate-200 text-sky-600 flex items-center justify-center hover:bg-sky-50 transition-colors">
                                <i class="fa-regular fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>`;
            });
        }

        function filtrarClientes() {
            const text = document.getElementById('buscador').value.toLowerCase();
            document.querySelectorAll('.cliente-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(text) ? 'flex' : 'none';
            });
        }

        function verCliente(id) {
            window.location.href = `editar.html?id=${id}`;
        }

        cargarClientes();
    </script>
</body>
</html>
