<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hielo Moscú - Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/clientes.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-8">

    <div class="max-w-xl md:max-w-4xl mx-auto min-h-screen bg-white shadow-xl md:my-6 md:rounded-3xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-sky-600 to-blue-400 rounded-2xl flex items-center justify-center text-white shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-mountain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-blue-950 tracking-tight leading-none">HIELO MOSCÚ</h1>
                    <p class="text-xs font-semibold text-sky-600 mt-0.5">Directorio de Clientes</p>
                </div>
            </div>
        </header>

        <!-- Contenido -->
        <main class="p-5 space-y-4 flex-1">
            
            <!-- Buscador -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-sky-500">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="buscador" onkeyup="filtrarClientes()" placeholder="Buscar cliente o negocio" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium text-slate-700 focus:outline-none focus:border-sky-500 transition-all">
            </div>

            <div class="flex items-center justify-between pt-1">
                <h2 class="text-sm font-bold text-blue-950">Lista de clientes</h2>
                <span id="contador-clientes" class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-lg">0 clientes</span>
            </div>

            <!-- Contenedor Limpio -->
            <div id="lista-clientes" class="space-y-3">
                <!-- Se llena desde localStorage -->
            </div>

        </main>

        <!-- Navegación -->
        <nav class="sticky md:relative bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-3 px-6 mt-auto">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <i class="fa-solid fa-map text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Mapa</span>
                </a>
                <a href="clientes.html" class="flex flex-col items-center text-sky-600 font-bold">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] mt-1">Clientes</span>
                </a>
                <a href="rutas.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span class="text-[10px] font-medium mt-1">Rutas</span>
                </a>
                <a href="agregar.html" class="flex flex-col items-center text-slate-400 hover:text-sky-600 transition-colors">
                    <div class="w-8 h-8 bg-sky-500 text-white rounded-full flex items-center justify-center shadow-md shadow-sky-500/30">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                    <span class="text-[10px] font-medium mt-1">Agregar</span>
                </a>
            </div>
        </nav>
    </div>

    <script>
        function cargarClientes() {
            // LEER ÚNICAMENTE DE LOCALSTORAGE
            const clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
            const contenedor = document.getElementById('lista-clientes');
            document.getElementById('contador-clientes').innerText = clientes.length + ' clientes';
            contenedor.innerHTML = '';

            if (clientes.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-slate-50 p-10 rounded-2xl border border-slate-100 text-center space-y-2">
                        <i class="fa-solid fa-users-slash text-3xl text-slate-300"></i>
                        <h3 class="text-xs font-bold text-blue-950">No hay clientes registrados</h3>
                        <p class="text-[11px] text-slate-400">Comienza a agregar clientes con el botón inferior.</p>
                    </div>`;
                return;
            }

            clientes.forEach(cliente => {
                contenedor.innerHTML += `
                    <div class="cliente-card bg-slate-50 hover:bg-white p-3.5 rounded-2xl border border-slate-100 hover:border-sky-200 hover:shadow-md transition-all flex items-center justify-between">
                        <div class="space-y-1">
                            <h3 class="text-xs font-bold text-blue-950">${cliente.nombre}</h3>
                            <p class="text-[11px] font-medium text-slate-400 flex items-center">
                                <i class="fa-solid fa-location-dot text-sky-500 mr-1"></i> ${cliente.direccion || 'Ubicación guardada'}
                            </p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="text-center px-2.5 py-1 rounded-xl bg-sky-100 text-sky-700">
                                <span class="block text-[10px] font-bold leading-tight">${cliente.ruta || 'Ruta 1'}</span>
                                <span class="block text-[9px] font-medium opacity-80">${cliente.dia || 'Lunes'}</span>
                            </div>
                            <button onclick="eliminarCliente(${cliente.id})" class="w-8 h-8 rounded-full bg-white border border-slate-200 text-rose-500 flex items-center justify-center hover:bg-rose-50 transition-colors">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>`;
            });
        }

        function eliminarCliente(id) {
            if (confirm('¿Deseas eliminar este cliente?')) {
                let clientes = JSON.parse(localStorage.getItem('hielo_moscu_clientes')) || [];
                clientes = clientes.filter(c => c.id !== id);
                localStorage.setItem('hielo_moscu_clientes', JSON.stringify(clientes));
                cargarClientes();
            }
        }

        function filtrarClientes() {
            const text = document.getElementById('buscador').value.toLowerCase();
            document.querySelectorAll('.cliente-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(text) ? 'flex' : 'none';
            });
        }

        cargarClientes();
    </script>
</body>
</html>
